name: Foundation CI
on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: outdoor_ci
          POSTGRES_DB: outdoor_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U outdoor_ci -d outdoor_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Disposable runner-only database. Never use trust auth for deployed databases.
      DATABASE_URL: postgresql://outdoor_ci@127.0.0.1:5432/outdoor_ci
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run build:mobile
      - run: git diff --exit-code -- package-lock.json
